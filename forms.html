<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>

    <style> /* ideally would be in its own file with href to link */
        
input:focus {
  background: black;
  color: white;
  border: 4px solid yellow;

}
input:valid {
  border: 2px solid green;
}

input:invalid {
  border: 1px dotted red;
}

label
 {
  display: block;
  margin-bottom: 10px;
}

/*will target any field that is not submit and is valid*/
input:not([type="submit"]):valid {
    border-color: #3d9ca8;
    box-shadow: 0 0 3px #3d9ca8;
}

/* Hide and show list of inputRequirements when interacting with input */
input:not([type="submit"]) + .inputRequirements {
  overflow: hidden;
  max-height: 0;
  transition: max-height 1s ease-out;
}

input:not([type="submit"]):hover + .inputRequirements,
input:not([type="submit"]):focus + .inputRequirements,
input:not([type="submit"]):active + .inputRequirements {
  max-height: 1000px; /* any large number (bigger then the .inputRequirements list) */
  transition: max-height 1s ease-in;
}

    </style>

</head>

<body>

    <header>
        <h1>super epic accessible form</h1>
    </header>

    <main>
        <section>
            <h2>form</h2>
            <form id="myform" method="post">
                <fieldset>
                    <legend>your SSN and credit card information please</legend>

                    <label for="username">
                        your name. (required)
                    <input type="text" id="username" required>
                    </label>

                    <label for="email">
                        your email. (required)
                    <input type="email" id="email" required>
                    </label>

                    <br> <!--haha this worked-->
                    <!--before i needed this to separate the fields into new lines. now i just have extra on top of css-->

                    <label for="website">
                        your website.
                    <input type="url" id="website">
                    </label>

                    <label for="phone">
                        you phone number
                    <input type="tel" id="phone" minlength="7">
                    </label>

                    <label for="age">
                        how old are you
                    <input type="number" id="age">
                    </label>

                    <br>

                    <label for="password">
                        hehehe you password (required)
                    <input type="text" id="password" maxlength="20" minlength="5" pattern="(?=.*\d)(?=.*[a-z])(?.*[A-Z])(?=.*[@#$%^&+!=]).*" required>
                    </label>
                    <ul class="inputRequirements">
                        <li> must be at least 5 characters and with uppercase and lowercase letters with symbols </li>
                    </ul>

                    <br>
                    <input type="submit" value="submit"> <!--this throws an error in WAVE for having no attribute if "value" is missing-->

                </fieldset>
            </form>
        </section>
    </main>

</body>
</html>
